<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#253e34"><title>꼬꼬마을 · 읽어서 지켜요</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#294235;background:#253e34;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:20px 22px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff9df;margin-bottom:18px}
h1{font-size:24px;letter-spacing:-1px;margin:3px 0}small{font-size:12px}header small{color:#c6d5bb}.brand-chicken{width:40px;height:40px;vertical-align:middle;object-fit:contain}
button,select{font:inherit;color:inherit;cursor:pointer}button{min-height:46px;border:1px solid #d8c89e;border-bottom:3px solid #c6ae78;border-radius:13px;padding:10px 15px;background:linear-gradient(#fffaf0,#f3e8c9);font-weight:700;touch-action:manipulation;transition:transform .12s}
button:active:not(:disabled){transform:translateY(2px)}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #17766a;outline-offset:3px}
#pause{color:#31503d;white-space:nowrap}select{padding:7px;background:#fffaf0;border:1px solid #dacfb1;border-radius:9px}
.game-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
.stage-card{min-width:0;border-radius:23px;overflow:hidden;background:#fff9e9;border:3px solid #e6d9b8;box-shadow:0 7px 0 #152d254d}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:12px 14px;background:#fff9e9}.pill{font-size:13px;font-weight:800;white-space:nowrap}
.scene{height:560px;position:relative;overflow:hidden;background:#b3cc91;isolation:isolate}
#villageCanvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:pan-y}
.scene[data-renderer="fallback"]{background:#b1cc8a url('art-handoff/coopnight/browser/backgrounds/background-meadow.png') center/cover}
.scene .hill,.scene .sun,.scene .cloud,.scene .trees,#wolf,#shot{display:none}
.house{position:absolute;left:9%;bottom:24%;width:120px;height:120px}.house img,#tower img{width:100%;height:100%;object-fit:contain}
.road{position:absolute;bottom:16%;height:36px;width:100%;background:#d7bd8a99}
#tower{position:absolute;left:40%;bottom:20%;width:83px;height:83px}#tower[data-level="0"]{opacity:.45}.empty-plot{font-size:11px;position:absolute;bottom:-8px;left:0;white-space:nowrap}
.village-extra{position:absolute;left:20%;bottom:55%;display:flex}.village-extra img{width:65px;height:65px}
.resident{position:absolute;left:38%;bottom:38%;width:46px;animation:roam 12s ease-in-out infinite}
.enemy{position:absolute;bottom:15%;width:45px;transform:translateX(-50%)}.enemy img{width:45px}.enemy progress{width:45px;height:7px;accent-color:#699c53}
.scene.is3d>.house,.scene.is3d>#tower,.scene.is3d>.road,.scene.is3d>.resident,.scene.is3d>.village-extra,.scene.is3d>#enemies{display:none}
#shield{position:absolute;z-index:2;top:12px;left:12px;max-width:calc(100% - 24px);padding:8px 12px;border-radius:12px;background:#fffbeded;font-size:12px;font-weight:700;box-shadow:0 2px 7px #3454381a}
#combatInfo{position:absolute;z-index:2;bottom:12px;right:10px;padding:5px 8px;background:#fffbeddf;border-radius:10px;font-size:11px}
#combatInfo:empty{display:none}
.stage-caption{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;font-size:12px;line-height:1.55;background:#fff9e9;border-top:1px solid #d7d9b4}
.live-dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#6a9d4e;box-shadow:0 0 0 3px #6a9d4e20}
#villageStatus{flex:1}
.panel{background:#fffaf0;border:2px solid #e9ddbd;border-radius:23px;padding:22px;box-shadow:0 6px 0 #142c2233}
.lesson-kicker{margin:0 0 15px;font-size:12px;letter-spacing:.06em;font-weight:800;color:#8e754a}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.toolbar label{font-size:13px}.toolbar button{flex:1 1 auto}#mode{font-size:13px}.settings{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;margin-top:12px}.settings input{width:17px;height:17px;vertical-align:middle}
#voiceStatus{font-size:12px;line-height:1.5;color:#74836d;margin:12px 0}h2{font-size:20px;line-height:1.5;letter-spacing:-.5px;margin:20px 0 12px}
#passage{font-size:18px;line-height:1.85;white-space:pre-line}
#answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
#answers button{font-size:34px;min-height:70px;border:2px solid #decfa6;border-bottom-width:5px;background:#fffef6;color:#294235;padding:9px}
#answers.long{grid-template-columns:1fr}#answers.long button{font-size:16px;min-height:50px;text-align:left;line-height:1.5}
#feedback{min-height:48px;font-size:14px;line-height:1.7;font-weight:700;color:#367353}
.lesson-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
#build{background:linear-gradient(#f8d986,#e9bc54);border-color:#c29637}#battle,#next{background:linear-gradient(#417e65,#2d6650);color:#fff9e5;border-color:#255741}
.growth-panel{margin-top:18px;padding:16px 20px}.growth-title{display:flex;align-items:center;justify-content:space-between;font-size:14px}.growth-title small{font-weight:400;color:#79856c}
#garden{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}#garden img{width:43px;height:43px;object-fit:contain}#garden span{font-size:13px;color:#70825e}
.growth-panel>small{color:#74836d;line-height:1.7}footer{color:#bdd0ba;font-size:11px;line-height:1.8;margin-top:18px}footer button{font-size:11px;min-height:34px;padding:5px 10px;margin-top:8px}
#effects{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.float{position:absolute;left:30%;top:45%;font-size:20px;font-weight:900;padding:7px 12px;background:#fffbe9ed;box-shadow:0 4px 0 #bba76a44;border-radius:12px;display:flex;align-items:center;gap:5px;animation:floatUp 1s forwards}
.coin-spin{display:inline-block;width:30px;height:30px;background:url('art-handoff/coopnight/browser/animation/front.png') center/contain no-repeat;animation:coinFrames .55s steps(1) infinite}
.impact{position:absolute;bottom:20%;width:48px;height:48px;background:url('art-handoff/coopnight/browser/animation/fx-impact.png') center/contain;animation:impactFade .26s forwards}
.scene.is3d .impact{display:none}.hidden{display:none!important}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}
@keyframes impactFade{to{transform:scale(1.4);opacity:0}}
@keyframes roam{0%,100%{translate:0 0;rotate:-3deg}50%{translate:45px -20px;rotate:3deg}}
@keyframes coinFrames{0%,100%{background-image:url('art-handoff/coopnight/browser/animation/front.png')}25%{background-image:url('art-handoff/coopnight/browser/animation/quarter.png')}50%{background-image:url('art-handoff/coopnight/browser/animation/edge.png')}75%{background-image:url('art-handoff/coopnight/browser/animation/reverse-quarter.png')}}
@media(max-width:760px){main{padding:10px 10px 20px}.game-layout{grid-template-columns:1fr;gap:12px}header{margin-bottom:10px}h1{font-size:18px}.brand-chicken{width:29px;height:29px}header small{font-size:10px}#pause{font-size:12px;padding:8px 11px;min-height:40px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 8px;gap:4px}.pill{font-size:10px;letter-spacing:-.3px}.scene{height:clamp(340px,51svh,480px)}.stage-card{border-width:2px;border-radius:18px}.stage-caption{padding:9px 10px;font-size:11px}.panel{padding:18px;border-radius:19px}.lesson-kicker{margin-bottom:12px}h2{margin-top:14px;font-size:19px}.lesson-actions{grid-template-columns:1fr 1fr}.lesson-actions #next{grid-column:1/-1}.lesson-actions button{font-size:12px;padding:10px 7px}#feedback{min-height:28px}.growth-panel{margin-top:12px}.growth-title small{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
body.reduced *,body.reduced *:before,body.reduced *:after{animation:none!important;transition:none!important}
body.paused *,body.paused *:before,body.paused *:after{animation-play-state:paused!important}
</style></head><body><main>
<header><div><small>한글 디펜스 · 살아 움직이는 마을 0.4</small><h1><img class="brand-chicken" src="art-handoff/coopnight/browser/characters/chicken.png" alt="">꼬꼬마을: 읽어서 지켜요</h1></div><button id="pause">잠깐 쉬기</button></header>
<div class="game-layout"><section class="stage-card" aria-label="우리 마을">
<div class="stats"><span class="pill" id="gold"></span><span class="pill" id="hp"></span><span class="pill" id="stage"></span><span class="pill" id="level"></span></div>
<div class="scene"><div class="road"></div><div class="house"><img id="houseArt" src="art-handoff/coopnight/browser/buildings/home-01.png" alt="우리 마을 집"></div><div class="village-extra" id="villageExtra" aria-hidden="true"></div><div id="tower" data-level="0"><img id="towerArt" src="art-handoff/coopnight/browser/buildings/tower-01.png" alt="방어 타워"><span class="empty-plot">타워를 세워요</span></div><img class="resident" src="art-handoff/coopnight/browser/characters/chicken.png" alt=""><div id="wolf"></div><span id="shot" aria-hidden="true"></span><div id="enemies" aria-label="다가오는 늑대"></div><div id="effects" aria-hidden="true"></div><div id="combatInfo" role="status"></div><div id="shield">읽는 동안 마을은 안전해요</div></div>
<div class="stage-caption"><span class="live-dot" aria-hidden="true"></span><span id="villageStatus">마을을 준비하고 있어요…</span></div></section>
<section class="panel lesson"><p class="lesson-kicker">읽고 · 모으고 · 지켜요</p><div class="toolbar"><label>나이 <select id="age"><option>7</option><option selected>8</option><option>9</option><option>10</option></select>세</label><button id="mode">📖 짧은 글 읽기</button><button id="speak">🔊 소리 듣기</button></div><div class="settings"><label><input id="sfx" type="checkbox" checked> 효과음</label><label><input id="motion" type="checkbox"> 움직임 줄이기</label><label>읽기 속도 <select id="rate"><option value=".7">천천히</option><option value=".85" selected>보통</option><option value="1">자연스럽게</option></select></label></div><p id="voiceStatus">소리를 듣고 글자를 골라 주세요.</p><h2 id="prompt"></h2><div id="passage"></div><div id="answers"></div><div id="feedback" role="status" aria-live="polite"></div><div class="lesson-actions"><button id="build">타워 만들기 · 40골드</button><button id="battle">늑대 막으러 가기 →</button><button id="next" class="hidden">다음 문제 →</button></div></section></div>
<section class="panel growth-panel"><div class="growth-title"><b>조금씩 자라는 우리 마을</b><small>한 글자씩 읽을 때마다 더 튼튼하게</small></div><div id="garden"></div><small>정답으로 골드를 모아 타워를 강화해요. 방어에 성공하면 마을도 자라나요.</small></section>
<footer>진행 상황은 이 브라우저에 저장됩니다. 나이는 기록용이며 학습 단계는 직접 선택할 수 있어요.<br><button id="reset">처음부터 시작</button></footer>
</main><script src="combat.js"></script><script>const BANK=[['나',['나','마','다']],['모',['무','모','마']],['가',['나','다','가']],['바',['바','파','다']],['소',['수','소','서']],['하',['나','아','하']]];
const STORY=[{text:'밤새 비가 와서 다리가 물에 잠겼어요.\n꼬꼬는 친구를 만나러 언덕길로 돌아갔어요.',q:'꼬꼬는 왜 언덕길로 갔나요?',a:['다리가 물에 잠겨서','언덕길이 더 짧아서','친구를 만나기 싫어서','꽃에 물을 주려고','친구가 이사해서'],key:0},{text:'꼬꼬는 꽃에 물을 주었어요.\n다음 날 작은 꽃이 활짝 피었어요.',q:'꼬꼬가 꽃을 위해 한 일은 무엇인가요?',a:['꽃을 꺾었어요','그늘에 숨겼어요','물을 주었어요','꽃을 친구에게 주었어요','물을 마셨어요'],key:2}];
const KEY='hangul-defense-v1';let state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:8};try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1){for(const k of ['gold','hp','level','wins','index','age'])if(Number.isSafeInteger(saved[k])&&saved[k]>=0)state[k]=saved[k];state.mode=saved.mode==='story'?'story':'sound';state.claimed=typeof saved.claimed==='string'?saved.claimed:null;state.completed=typeof saved.completed==='string'?saved.completed:null;state.level=Math.min(state.level,5);state.hp=Math.min(state.hp,100);state.age=[7,8,9,10].includes(state.age)?state.age:8;state.combat=Combat.valid(saved.combat)?saved.combat:null}}catch{}let phase='question',answered=false,paused=false,wrong=0,progress=0,ticks=0;
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:1}))}catch{$('feedback').textContent='저장 공간을 사용할 수 없어요. 이번 판은 계속할 수 있어요.'}}

const ART='art-handoff/coopnight/browser/';
let artStamp='';
function artImage(file,alt=''){const img=document.createElement('img');img.src=ART+file;img.alt=alt;img.draggable=false;return img}
function updateVillageArt(){
 const stamp=state.level+':'+state.wins;if(stamp===artStamp)return;artStamp=stamp;
 const towerNumbers=['01','01','03','05','08','10'];$('towerArt').src=ART+'buildings/tower-'+towerNumbers[state.level]+'.png';
 const home=String(Math.min(5,1+Math.floor(state.wins/3))).padStart(2,'0');$('houseArt').src=ART+'buildings/home-'+home+'.png';
 $('villageExtra').innerHTML='';if(state.wins>=3)$('villageExtra').append(artImage('buildings/coop.png'));if(state.wins>=6)$('villageExtra').append(artImage('buildings/store.png'));
 $('garden').innerHTML='';$('garden').append(artImage('buildings/home-'+home+'.png','성장한 집'));$('garden').append(artImage('characters/chicken.png','꼬꼬'));if(state.wins>=3)$('garden').append(artImage('buildings/coop.png','닭장'));if(state.wins>=6)$('garden').append(artImage('buildings/store.png','가게'));
 const label=document.createElement('span');label.textContent='마을 성장 '+Math.min(5,1+Math.floor(state.wins/3))+'단계';$('garden').append(label);
}

function render(){ document.body.classList.toggle('paused',paused); $('gold').textContent='🪙 '+state.gold+'골드';$('hp').textContent='💚 성문 '+state.hp;$('level').textContent='🗼 타워 '+state.level+'단계';$('stage').textContent='🏅 방어 성공 '+state.wins+'회';$('tower').dataset.level=state.level;updateVillageArt();$('build').textContent=state.level===5?'최고 단계!':state.level?'✨ 타워 강화 · 40골드':'🏗️ 타워 만들기 · 40골드';$('build').disabled=state.gold<40||state.level>=5||paused;$('battle').disabled=!answered||phase!=='question'||paused;$('shield').textContent=paused?'⏸️ 쉬는 중이에요':phase==='battle'?'⚔️ 타워가 늑대를 막고 있어요':'🛡️ 읽는 동안 마을은 안전해요';$('pause').textContent=paused?'계속하기':'잠깐 쉬기';$('mode').disabled=phase==='battle'||paused;$('speak').disabled=phase==='battle'||paused;$('age').disabled=phase==='battle'||paused;}
function token(){return state.mode+':'+state.index}function question(){phase='question';answered=state.claimed===token();wrong=0;progress=0;$('wolf').style.left='85%';$('next').classList.add('hidden');$('answers').innerHTML='';$('feedback').textContent='';let q;if(state.mode==='sound'){q=BANK[state.index%BANK.length];$('prompt').textContent='소리를 듣고 맞는 글자를 찾아주세요';$('passage').textContent='';$('answers').className='';q[1].forEach(v=>add(v,v===q[0]));}else{q=STORY[state.index%STORY.length];$('prompt').textContent=q.q;$('passage').textContent=q.text;$('answers').className='long';q.a.forEach((v,i)=>add(v,i===q.key))}$('mode').textContent=state.mode==='sound'?'📖 짧은 글 읽기':'🔤 소리와 글자';if(answered){document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);$('feedback').textContent='이 문제의 골드는 이미 받았어요. 방어를 이어가세요.'}if(state.completed===token()){phase='result';$('next').classList.remove('hidden');$('feedback').textContent='방어 결과가 저장되어 있어요. 다음 문제로 가세요.'}if(answered&&state.completed!==token()&&Combat.valid(state.combat)&&state.combat.stage===state.index&&!state.combat.done){phase='battle';paused=true;drawCombat();$('feedback').textContent='전투를 저장한 지점부터 이어갈 수 있어요. 계속하기를 눌러 주세요.'}render();}
function add(label,correct){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(paused||answered||phase!=='question')return;if(correct){answered=true;state.claimed=token();state.gold+=state.mode==='story'?40:20;burst(state.mode==='story'?'+40 🪙':'+20 🪙');tone(880);window.VillageView?.reward();$('feedback').textContent='맞았어요! 🪙 +'+(state.mode==='story'?40:20)+'골드 · 타워를 만들거나 강화해 보세요.';document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);save();render()}else{wrong++;$('feedback').textContent=wrong<2?'괜찮아요. 다시 생각해 볼까요?':'함께 풀어요. 초록색으로 표시한 답을 골라보세요.';b.style.opacity='.45';if(wrong>=2)document.querySelectorAll('#answers button').forEach(x=>{const right=state.mode==='sound'?BANK[state.index%BANK.length][0]:STORY[state.index%STORY.length].a[STORY[state.index%STORY.length].key];if(x.textContent===right)x.style.background='#b9e6be'})}};$('answers').append(b)}
$('build').onclick=()=>{if(state.gold<40||state.level>=5||paused)return;state.gold-=40;state.level++;save();render();burst('강화! ✨');window.VillageView?.upgrade();tone(660);$('feedback').textContent='✨ 타워가 강해졌어요! 강화된 공격을 확인해 보세요.'};

function burst(text){const e=document.createElement('span');e.className='float';if(text.includes('🪙')){const coin=document.createElement('span');coin.className='coin-spin';e.append(coin);const label=document.createElement('span');label.textContent=text.replace('🪙','').trim();e.append(label)}else e.textContent=text;$('effects').append(e);setTimeout(()=>e.remove(),1000)}
let audioContext;
function tone(freq){if(!$('sfx').checked||paused)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioContext=audioContext||new A();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.04,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.12);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.13)}catch{}}
function drawCombat(events=[]){
 window.VillageView?.events(events);
 const b=state.combat;if(!b)return;$('enemies').innerHTML='';
 for(const e of b.enemies){if(e.hp<=0||e.escaped||e.x>100)continue;const n=document.createElement('div');n.className='enemy'+(events.some(v=>v.type==='hit'&&v.id===e.id)?' hit':'');n.style.left=e.x+'%';n.append(artImage('wolves/wolf.png','늑대'));const bar=document.createElement('progress');bar.max=e.maxHp;bar.value=e.hp;bar.setAttribute('aria-label','늑대 체력 '+e.hp+' / '+e.maxHp);n.append(bar);$('enemies').append(n)}
 $('combatInfo').textContent='막음 '+b.kills+' / '+b.enemies.length+' · 성문 도착 '+b.leaked;
 for(const e of events){if(e.type==='hit'){const hit=document.createElement('span');hit.className='impact';hit.style.left=e.x+'%';$('effects').append(hit);setTimeout(()=>hit.remove(),280);$('shot').textContent='💧';$('shot').style.left=e.x+'%';tone(360);setTimeout(()=>{$('shot').textContent=''},150)}if(e.type==='leak'){state.hp=Math.max(0,state.hp-e.damage);burst('성문 −'+e.damage)}}
}
$('battle').onclick=()=>{if(!answered||phase!=='question'||paused)return;phase='battle';state.combat=Combat.create(state.index);ticks=0;save();drawCombat();render()};
setInterval(()=>{if(phase!=='battle'||paused)return;ticks++;const events=Combat.step(state.combat,state.level,.1);drawCombat(events);
 if(state.combat.done){const won=state.combat.leaked===0;if(won){state.wins++;burst('마을을 지켰어요!');tone(1046);$('feedback').textContent='🎉 모두 막았어요! 마을이 조금 더 자랐어요.'}else{$('feedback').textContent='늑대 '+state.combat.leaked+'마리가 성문에 도착했어요. 다음에는 타워를 강화해 보세요.'}state.completed=token();phase='result';$('next').classList.remove('hidden');save();render()}
 else {if(ticks%10===0)save();render()}
},100);
$('next').onclick=()=>{if(phase!=='result'||paused)return;state.index++;state.combat=null;state.hp=Math.max(state.hp,60);save();question()};$('pause').onclick=()=>{paused=!paused;save();if(paused&&window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('#answers button').forEach(x=>x.disabled=paused||answered);$('next').disabled=paused;render()};
$('mode').onclick=()=>{if(phase==='battle'||paused)return;if(answered){$('feedback').textContent='이번 방어를 마친 뒤 다음 문제에서 바꿀 수 있어요.';return}state.mode=state.mode==='sound'?'story':'sound';save();question()};$('age').value=state.age;$('age').onchange=()=>{state.age=Number($('age').value);save()};
$('speak').onclick=()=>{if(paused||phase==='battle')return;const text=state.mode==='sound'?BANK[state.index%BANK.length][0]:STORY[state.index%STORY.length].text;if(!window.speechSynthesis){$('feedback').textContent='소리 도움말: '+text;return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=Number($('rate').value)||.85;const voices=speechSynthesis.getVoices();const ko=voices.find(v=>/^ko([-_]|$)/i.test(v.lang));if(ko)u.voice=ko;$('voiceStatus').textContent=ko?'한국어 음성: '+ko.name:'기본 한국어 음성을 요청했어요. 들리지 않으면 도움말을 이용하세요.';u.onstart=()=>{$('voiceStatus').textContent='읽어 주는 중이에요'};u.onend=()=>{$('voiceStatus').textContent='다시 듣거나 직접 읽어 보세요.'};u.onerror=()=>{$('voiceStatus').textContent='이 기기에서 음성을 재생하지 못했어요.';$('feedback').textContent='음성을 사용할 수 없어요. 소리 도움말: '+text};speechSynthesis.speak(u)};
$('reset').onclick=()=>{if(confirm('저장된 골드와 마을을 초기화할까요?')){state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:8};paused=false;$('age').value=8;if(window.speechSynthesis)speechSynthesis.cancel();save();question()}};$('motion').onchange=()=>document.body.classList.toggle('reduced',$('motion').checked);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)$('pause').click()});question();

window.getVillageState=()=>({level:state.level,wins:state.wins,phase,paused,combat:state.combat});
</script><script src="village.js" defer></script></body></html>
