<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꼬꼬마을 · 읽어서 지켜요</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e4;color:#263d36;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:26px;margin:4px 0}small{color:#64766a}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.pill{background:white;padding:10px 16px;border-radius:20px;font-weight:bold}.scene{position:relative;overflow:hidden;height:240px;background:linear-gradient(#b7e3e7 55%,#93bb72 55%);border-radius:24px;border:4px solid white}.hill{position:absolute;bottom:0;left:-30px;width:650px;height:180px;background:#a9cc8e;border-radius:50% 65% 0 0}.house{position:absolute;left:25px;bottom:35px;font-size:90px}.road{position:absolute;bottom:30px;height:40px;width:100%;background:#d7bd8a;transform:rotate(-2deg)}#wolf{position:absolute;bottom:44px;font-size:48px;transition:left .1s linear}#tower{position:absolute;bottom:70px;left:180px;font-size:54px}#shield{position:absolute;top:12px;left:16px;background:#fff9;padding:9px;border-radius:20px}#shot{position:absolute;left:240px;bottom:100px;color:#087daa;font-size:30px}.panel{margin-top:18px;background:white;border-radius:24px;padding:24px;box-shadow:0 8px 25px #2947380c}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:#e9efdf;color:#24432f;cursor:pointer}button.primary{background:#26795e;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:4px solid #ffbd39}#answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}#answers button{font-size:34px;font-weight:750;min-height:70px;background:#f2f3e9;border:2px solid #dce5d7}#answers.long{grid-template-columns:1fr}#answers.long button{font-size:18px;min-height:52px;text-align:left}#feedback{min-height:30px;font-weight:bold;color:#26795e}#passage{font-size:21px;line-height:1.8;white-space:pre-line}footer{margin:20px 0;color:#69766b;font-size:13px}.growth{font-size:24px}.hidden{display:none!important}@media(max-width:600px){main{padding:12px}h1{font-size:21px}header{align-items:flex-start;flex-direction:column}.panel{padding:16px}.scene{height:200px}.house{font-size:70px}#answers button{font-size:28px;padding:12px}.toolbar button{flex:1}#tower{left:130px}}
</style><main><header><div><small>한글 디펜스 · 플레이 프로토타입 0.1</small><h1>🐥 꼬꼬마을: 읽어서 지켜요</h1></div><button id="pause">잠깐 쉬기</button></header><div class="stats"><span class="pill" id="gold"></span><span class="pill" id="hp"></span><span class="pill" id="stage"></span><span class="pill" id="level"></span></div><div class="scene"><div class="hill"></div><div class="road"></div><div class="house">🏡</div><div id="tower">🌱</div><div id="wolf">🐺</div><span id="shot"></span><div id="shield">🛡️ 읽는 동안 마을은 안전해요</div></div><div class="panel"><div class="toolbar"><label>연령 기록(난이도 미반영) <select id="age"><option>7</option><option selected>8</option><option>9</option><option>10</option></select>세</label><button id="mode">📖 짧은 글 읽기</button><button id="speak">🔊 소리 듣기</button></div><h2 id="prompt"></h2><div id="passage"></div><div id="answers"></div><div id="feedback" role="status" aria-live="polite"></div><div class="toolbar"><button class="primary" id="build">🏗️ 타워 만들기 · 40골드</button><button id="battle">늑대 막으러 가기 →</button><button id="next" class="hidden">다음 문제 →</button></div></div><div class="panel"><b>우리 마을의 성장</b><p class="growth" id="garden"></p><small>정답을 맞히면 골드를 얻어요. 타워를 강화하고 짧은 전투를 지켜보세요. 틀려도 골드를 잃지 않아요.</small></div><footer>임시 아트(이모지) · 저장은 이 브라우저에만 됩니다. 녹음·개인정보 전송 없음. 음성이 안 들리면 소리 도움말로 연습할 수 있어요.<br><button id="reset">처음부터 시작</button></footer></main><script>
const BANK=[['나',['나','마','다']],['모',['무','모','마']],['가',['나','다','가']],['바',['바','파','다']],['소',['수','소','서']],['하',['나','아','하']]];
const STORY=[{text:'밤새 비가 와서 다리가 물에 잠겼어요.\n꼬꼬는 친구를 만나러 언덕길로 돌아갔어요.',q:'꼬꼬는 왜 언덕길로 갔나요?',a:['다리가 물에 잠겨서','언덕길이 더 짧아서','친구를 만나기 싫어서'],key:0},{text:'꼬꼬는 꽃에 물을 주었어요.\n다음 날 작은 꽃이 활짝 피었어요.',q:'꼬꼬가 꽃을 위해 한 일은 무엇인가요?',a:['물을 주었어요','꽃을 꺾었어요','그늘에 숨겼어요'],key:0}];
const KEY='hangul-defense-v1';let state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:8};try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1){for(const k of ['gold','hp','level','wins','index','age'])if(Number.isSafeInteger(saved[k])&&saved[k]>=0)state[k]=saved[k];state.mode=saved.mode==='story'?'story':'sound';state.claimed=typeof saved.claimed==='string'?saved.claimed:null;state.completed=typeof saved.completed==='string'?saved.completed:null;state.level=Math.min(state.level,5);state.hp=Math.min(state.hp,100)}}catch{}let phase='question',answered=false,paused=false,wrong=0,progress=0,ticks=0;
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:1}))}catch{$('feedback').textContent='저장 공간을 사용할 수 없어요. 이번 판은 계속할 수 있어요.'}}
function render(){ $('gold').textContent='🪙 '+state.gold+'골드';$('hp').textContent='💚 성문 '+state.hp;$('level').textContent='🗼 타워 '+state.level+'단계';$('stage').textContent='🏅 방어 성공 '+state.wins+'회';$('tower').textContent=['🌱','🗼','🏰','🏰','🏯','🏯'][state.level];$('garden').textContent='🌳 '+ '🌷'.repeat(Math.min(state.wins,16))+' 🐣';$('build').textContent=state.level===5?'최고 단계!':state.level?'✨ 타워 강화 · 40골드':'🏗️ 타워 만들기 · 40골드';$('build').disabled=state.gold<40||state.level>=5||phase==='battle'||paused;$('battle').disabled=!answered||phase!=='question'||paused;$('shield').textContent=paused?'⏸️ 쉬는 중이에요':phase==='battle'?'⚔️ 타워가 늑대를 막고 있어요':'🛡️ 읽는 동안 마을은 안전해요';$('pause').textContent=paused?'계속하기':'잠깐 쉬기';$('mode').disabled=phase==='battle'||paused;$('speak').disabled=phase==='battle'||paused;$('age').disabled=phase==='battle';}
function token(){return state.mode+':'+state.index}function question(){phase='question';answered=state.claimed===token();wrong=0;progress=0;$('wolf').style.left='85%';$('next').classList.add('hidden');$('answers').innerHTML='';$('feedback').textContent='';let q;if(state.mode==='sound'){q=BANK[state.index%BANK.length];$('prompt').textContent='소리를 듣고 맞는 글자를 찾아주세요';$('passage').textContent='';$('answers').className='';q[1].forEach(v=>add(v,v===q[0]));}else{q=STORY[state.index%STORY.length];$('prompt').textContent=q.q;$('passage').textContent=q.text;$('answers').className='long';q.a.forEach((v,i)=>add(v,i===q.key))}$('mode').textContent=state.mode==='sound'?'📖 짧은 글 읽기':'🔤 소리와 글자';if(answered){document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);$('feedback').textContent='이 문제의 골드는 이미 받았어요. 방어를 이어가세요.'}if(state.completed===token()){phase='result';$('next').classList.remove('hidden');$('feedback').textContent='방어 결과가 저장되어 있어요. 다음 문제로 가세요.'}render();}
function add(label,correct){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(paused||answered||phase!=='question')return;if(correct){answered=true;state.claimed=token();state.gold+=20;$('feedback').textContent='맞았어요! 🪙 +20골드 · 타워를 만들거나 강화해 보세요.';document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);save();render()}else{wrong++;$('feedback').textContent=wrong<2?'괜찮아요. 다시 생각해 볼까요?':'함께 풀어요. 초록색으로 표시한 답을 골라보세요.';b.style.opacity='.45';if(wrong>=2)document.querySelectorAll('#answers button').forEach(x=>{const right=state.mode==='sound'?BANK[state.index%BANK.length][0]:STORY[state.index%STORY.length].a[0];if(x.textContent===right)x.style.background='#b9e6be'})}};$('answers').append(b)}
$('build').onclick=()=>{if(state.gold<40||state.level>=5||paused||phase==='battle')return;state.gold-=40;state.level++;save();render();$('feedback').textContent='✨ 타워가 강해졌어요! 다음 전투에서 확인해 보세요.'};
$('battle').onclick=()=>{if(!answered||phase!=='question'||paused)return;phase='battle';progress=0;ticks=0;render()};
setInterval(()=>{if(phase!=='battle'||paused)return;ticks++;progress+=1;$('wolf').style.left=(85-progress*.8)+'%';$('shot').textContent=ticks%8<3?'💧':'';if(progress>=Math.max(25,65-state.level*8)){let won=state.level>0;if(won){state.wins++;$('feedback').textContent='🎉 늑대가 물러났어요! 마을에 꽃이 피었어요.'}else{state.hp=Math.max(0,state.hp-10);$('feedback').textContent='🐥 친구가 도와줬어요. 다음에는 타워를 세워 보세요.'}state.completed=token();phase='result';$('shot').textContent='';$('wolf').style.left='95%';$('next').classList.remove('hidden');save();render()}},100);
$('next').onclick=()=>{if(phase!=='result'||paused)return;state.index++;state.hp=Math.max(state.hp,60);save();question()};$('pause').onclick=()=>{paused=!paused;if(paused&&window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('#answers button').forEach(x=>x.disabled=paused||answered);$('next').disabled=paused;render()};
$('mode').onclick=()=>{if(phase==='battle'||paused)return;if(answered){$('feedback').textContent='이번 방어를 마친 뒤 다음 문제에서 바꿀 수 있어요.';return}state.mode=state.mode==='sound'?'story':'sound';save();question()};$('age').value=state.age;$('age').onchange=()=>{state.age=Number($('age').value);save()};
$('speak').onclick=()=>{if(paused||phase==='battle')return;const text=state.mode==='sound'?BANK[state.index%BANK.length][0]:STORY[state.index%STORY.length].text;if(!window.speechSynthesis){$('feedback').textContent='소리 도움말: '+text;return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.8;u.onerror=()=>{$('feedback').textContent='음성을 사용할 수 없어요. 소리 도움말: '+text};speechSynthesis.speak(u)};
$('reset').onclick=()=>{if(confirm('저장된 골드와 마을을 초기화할까요?')){state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:8};paused=false;$('age').value=8;if(window.speechSynthesis)speechSynthesis.cancel();save();question()}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)$('pause').click()});question();
</script></html>
