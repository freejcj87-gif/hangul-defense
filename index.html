<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꼬꼬마을 · 읽어서 지켜요</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e4;color:#263d36;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:26px;margin:4px 0}small{color:#64766a}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.pill{background:white;padding:10px 16px;border-radius:20px;font-weight:bold}.scene{position:relative;overflow:hidden;height:240px;background:linear-gradient(#b7e3e7 55%,#93bb72 55%);border-radius:24px;border:4px solid white}.hill{position:absolute;bottom:0;left:-30px;width:650px;height:180px;background:#a9cc8e;border-radius:50% 65% 0 0}.house{position:absolute;left:25px;bottom:35px;font-size:90px}.road{position:absolute;bottom:30px;height:40px;width:100%;background:#d7bd8a;transform:rotate(-2deg)}#wolf{position:absolute;bottom:44px;font-size:48px;transition:left .1s linear}#tower{position:absolute;bottom:70px;left:180px;font-size:54px}#shield{position:absolute;top:12px;left:16px;background:#fff9;padding:9px;border-radius:20px}#shot{position:absolute;left:240px;bottom:100px;color:#087daa;font-size:30px}.panel{margin-top:18px;background:white;border-radius:24px;padding:24px;box-shadow:0 8px 25px #2947380c}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:#e9efdf;color:#24432f;cursor:pointer}button.primary{background:#26795e;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:4px solid #ffbd39}#answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}#answers button{font-size:34px;font-weight:750;min-height:70px;background:#f2f3e9;border:2px solid #dce5d7}#answers.long{grid-template-columns:1fr}#answers.long button{font-size:18px;min-height:52px;text-align:left}#feedback{min-height:30px;font-weight:bold;color:#26795e}#passage{font-size:21px;line-height:1.8;white-space:pre-line}footer{margin:20px 0;color:# body{background:#f3eedf;color:#294638}main{max-width:1040px}h1{letter-spacing:-1px}.panel{border:1px solid #dce1ca;box-shadow:0 5px 0 #dce1ca;padding:22px}.pill{border:1px solid #e1ddc7;box-shadow:0 3px 0 #dfdccb}button{min-height:48px;touch-action:manipulation;border-bottom:4px solid #c6d3b8;transition:transform .12s,filter .12s}button:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px}button.primary{background:#f0cc72;color:#3f4629;border-color:#b89948}button:focus-visible,select:focus-visible{outline:3px solid #b67913;outline-offset:3px}.scene{height:300px;background:linear-gradient(#cde9df 0 53%,#b3cf89 53%);border:6px solid #fffdf2;box-shadow:0 5px 0 #d7dfc3}.hill{width:120%;height:180px;background:#a2c481;bottom:-45px}.road{height:42px;bottom:40px;background:#deca99;border-top:3px dashed #f3e4b6}.sun{position:absolute;right:14%;top:20px;width:47px;height:47px;border-radius:50%;background:#f5d77d;box-shadow:0 0 0 12px #f5d77d33}.cloud{position:absolute;top:34px;left:38%;width:90px;height:22px;background:#fffaf0;border-radius:30px;box-shadow:20px -12px 0 -2px #fffaf0}.trees{position:absolute;bottom:82px;right:8%;font-size:36px;opacity:.8;letter-spacing:15px}.house{left:3%;bottom:38px;font-size:initial;width:90px;height:92px;background:#fff0c7;border:3px solid #8a744a;border-radius:12px 12px 8px 8px;box-shadow:5px 7px 0 #46583922}.house:before{content:'';position:absolute;left:-12px;top:-30px;width:106px;height:48px;background:#bd7552;clip-path:polygon(50% 0,100% 70%,94% 100%,6% 100%,0 70%)}.house:after{content:'▦';position:absolute;bottom:0;left:28px;background:#87724d;color:#f6d47b;width:28px;height:45px;text-align:center;border-radius:14px 14px 0 0}#tower{left:23%;bottom:69px;font-size:initial;width:46px;height:66px;background:#e3d2a2;border:3px solid #726d48;border-radius:6px;box-shadow:4px 5px 0 #46583922;transition:height .25s,filter .2s}#tower:before{content:'';position:absolute;top:-18px;left:-9px;width:58px;height:25px;background:#588e70;clip-path:polygon(50% 0,100% 60%,100% 100%,0 100%,0 60%)}#tower:after{content:'●';position:absolute;top:16px;left:11px;font-size:22px;color:#538fa6}#tower[data-level="0"]{opacity:.35;height:30px}#tower[data-level="2"],#tower[data-level="3"]{height:84px}#tower[data-level="4"],#tower[data-level="5"]{height:102px}#wolf{display:none}.enemy{position:absolute;bottom:47px;width:46px;height:47px;transform:translateX(-50%);font-size:32px;line-height:37px}.enemy progress{display:block;width:42px;height:7px;accent-color:#749a55;background:#e0d1b7}.enemy.hit{filter:brightness(1.7)}#shot{left:27%;bottom:107px;font-size:25px;transition:left .12s,bottom .12s}#combatInfo{position:absolute;bottom:8px;right:14px;font-size:12px;font-weight:700;color:#5c6043}#effects{position:absolute;inset:0;pointer-events:none;overflow:hidden}.float{position:absolute;left:28%;top:45%;font-weight:900;color:#836014;font-size:24px;animation:floatUp .9s forwards}.gold-pop{animation:pop .5s}.village-extra{position:absolute;left:13%;bottom:146px;font-size:24px}.growth{line-height:1.8}#shield{max-width:calc(100% - 26px);font-size:13px;background:#fffdf0e8;border:1px solid #d5ddc7}#answers button{box-shadow:0 4px 0 #dce5d7}#answers.long button{font-size:17px;line-height:1.5}#feedback{line-height:1.65}.settings{font-size:13px;display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}.settings input{width:18px;height:18px;vertical-align:middle}#voiceStatus{font-size:12px;color:#64766a}.battle-hit{animation:pop .2s}
@keyframes floatUp{to{transform:translateY(-65px);opacity:0}}@keyframes pop{50%{transform:scale(1.13)}}@media(max-width:600px){.scene{height:240px}.house{width:62px;height:69px}.house:before{width:78px;top:-27px}.house:after{left:18px;width:22px;height:34px}#tower{left:26%;width:38px}#tower:before{width:50px}.panel{padding:15px}.toolbar{gap:8px}.toolbar button{flex:1 1 130px}.trees{letter-spacing:3px;font-size:27px}.village-extra{bottom:131px;font-size:18px}.pill{padding:8px 10px;font-size:13px}#passage{font-size:19px}#shot{left:30%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}body.reduced *,body.reduced *:before,body.reduced *:after{animation:none!important;transition:none!important}
</style><main><header><div><small>한글 디펜스 · 전투·마을 개선판 0.2</small><h1>🐥 꼬꼬마을: 읽어서 지켜요</h1></div><button id="pause">잠깐 쉬기</button></header><div class="stats"><span class="pill" id="gold"></span><span class="pill" id="hp"></span><span class="pill" id="stage"></span><span class="pill" id="level"></span></div><div class="scene"><div class="hill"></div><div class="road"></div><div class="sun"></div><div class="cloud"></div><div class="trees" aria-hidden="true">🌳 🌲 🌳</div><div class="house" aria-label="우리 마을 집"></div><div class="village-extra" id="villageExtra" aria-hidden="true"></div><div id="tower" data-level="0" aria-label="방어 타워"></div><div id="wolf">🐺</div><span id="shot" aria-hidden="true"></span><div id="enemies" aria-label="다가오는 늑대"></div><div id="effects" aria-hidden="true"></div><div id="combatInfo" role="status"></div><div id="shield">🛡️ 읽는 동안 마을은 안전해요</div></div><div class="panel"><div class="toolbar"><label>연령 기록(난이도 미반영) <select id="age"><option>7</option><option selected>8</option><option>9</option><option>10</option></select>세</label><button id="mode">📖 짧은 글 읽기</button><button id="speak">🔊 소리 듣기</button></div><div class="settings"><label><input id="sfx" type="checkbox" checked> 효과음</label><label><input id="motion" type="checkbox"> 움직임 줄이기</label><label>읽기 속도 <select id="rate"><option value=".7">천천히</option><option value=".85" selected>보통</option><option value="1">자연스럽게</option></select></label></div><p id="voiceStatus">소리 듣기를 눌러 한국어 음성을 확인해 주세요.</p><h2 id="prompt"></h2><div id="passage"></div><div id="answers"></div><div id="feedback" role="status" aria-live="polite"></div><div class="toolbar"><button class="primary" id="build">🏗️ 타워 만들기 · 40골드</button><button id="battle">늑대 막으러 가기 →</button><button id="next" class="hidden">다음 문제 →</button></div></div><div class="panel"><b>우리 마을의 성장</b><p class="growth" id="garden"></p><small>정답을 맞히면 골드를 얻어요. 타워를 강화하고 짧은 전투를 지켜보세요. 틀려도 골드를 잃지 않아요.</small></div><footer>임시 아트(CSS·이모지, 원본 자산 미적용) · 저장은 이 브라우저에만 됩니다. 녹음·개인정보 전송 없음. 음성이 안 들리면 소리 도움말로 연습할 수 있어요.<br><button id="reset">처음부터 시작</button></footer></main><script src="combat.js"></script><script>
const BANK=[['나',['나','마','다']],['모',['무','모','마']],['가',['나','다','가']],['바',['바','파','다']],['소',['수','소','서']],['하',['나','아','하']]];
const STORY=[{text:'밤새 비가 와서 다리가 물에 잠겼어요.\n꼬꼬는 친구를 만나러 언덕길로 돌아갔어요.',q:'꼬꼬는 왜 언덕길로 갔나요?',a:['다리가 물에 잠겨서','언덕길이 더 짧아서','친구를 만나기 싫어서','꽃에 물을 주려고','친구가 이사해서'],key:0},{text:'꼬꼬는 꽃에 물을 주었어요.\n다음 날 작은 꽃이 활짝 피었어요.',q:'꼬꼬가 꽃을 위해 한 일은 무엇인가요?',a:['꽃을 꺾었어요','그늘에 숨겼어요','물을 주었어요','꽃을 친구에게 주었어요','물을 마셨어요'],key:2}];
const KEY='hangul-defense-v1';let state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:8};try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1){for(const k of ['gold','hp','level','wins','index','age'])if(Number.isSafeInteger(saved[k])&&saved[k]>=0)state[k]=saved[k];state.mode=saved.mode==='story'?'story':'sound';state.claimed=typeof saved.claimed==='string'?saved.claimed:null;state.completed=typeof saved.completed==='string'?saved.completed:null;state.level=Math.min(state.level,5);state.hp=Math.min(state.hp,100);state.age=[7,8,9,10].includes(state.age)?state.age:8;state.combat=Combat.valid(saved.combat)?saved.combat:null}}catch{}let phase='question',answered=false,paused=false,wrong=0,progress=0,ticks=0;
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:1}))}catch{$('feedback').textContent='저장 공간을 사용할 수 없어요. 이번 판은 계속할 수 있어요.'}}
function render(){ $('gold').textContent='🪙 '+state.gold+'골드';$('hp').textContent='💚 성문 '+state.hp;$('level').textContent='🗼 타워 '+state.level+'단계';$('stage').textContent='🏅 방어 성공 '+state.wins+'회';$('tower').dataset.level=state.level;$('villageExtra').textContent=state.wins>=6?'🏠 🌷 🏠':state.wins>=3?'🌷 🏠':'🌱';$('garden').textContent='🌳 '+ '🌷'.repeat(Math.min(state.wins,16))+' 🐣';$('build').textContent=state.level===5?'최고 단계!':state.level?'✨ 타워 강화 · 40골드':'🏗️ 타워 만들기 · 40골드';$('build').disabled=state.gold<40||state.level>=5||paused;$('battle').disabled=!answered||phase!=='question'||paused;$('shield').textContent=paused?'⏸️ 쉬는 중이에요':phase==='battle'?'⚔️ 타워가 늑대를 막고 있어요':'🛡️ 읽는 동안 마을은 안전해요';$('pause').textContent=paused?'계속하기':'잠깐 쉬기';$('mode').disabled=phase==='battle'||paused;$('speak').disabled=phase==='battle'||paused;$('age').disabled=phase==='battle'||paused;}
function token(){return state.mode+':'+state.index}function question(){phase='question';answered=state.claimed===token();wrong=0;progress=0;$('wolf').style.left='85%';$('next').classList.add('hidden');$('answers').innerHTML='';$('feedback').textContent='';let q;if(state.mode==='sound'){q=BANK[state.index%BANK.length];$('prompt').textContent='소리를 듣고 맞는 글자를 찾아주세요';$('passage').textContent='';$('answers').className='';q[1].forEach(v=>add(v,v===q[0]));}else{q=STORY[state.index%STORY.length];$('prompt').textContent=q.q;$('passage').textContent=q.text;$('answers').className='long';q.a.forEach((v,i)=>add(v,i===q.key))}$('mode').textContent=state.mode==='sound'?'📖 짧은 글 읽기':'🔤 소리와 글자';if(answered){document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);$('feedback').textContent='이 문제의 골드는 이미 받았어요. 방어를 이어가세요.'}if(state.completed===token()){phase='result';$('next').classList.remove('hidden');$('feedback').textContent='방어 결과가 저장되어 있어요. 다음 문제로 가세요.'}if(answered&&state.completed!==token()&&Combat.valid(state.combat)&&state.combat.stage===state.index&&!state.combat.done){phase='battle';paused=true;drawCombat();$('feedback').textContent='전투를 저장한 지점부터 이어갈 수 있어요. 계속하기를 눌러 주세요.'}render();}
function add(label,correct){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(paused||answered||phase!=='question')return;if(correct){answered=true;state.claimed=token();state.gold+=state.mode==='story'?40:20;burst(state.mode==='story'?'+40 🪙':'+20 🪙');tone(880);$('feedback').textContent='맞았어요! 🪙 +'+(state.mode==='story'?40:20)+'골드 · 타워를 만들거나 강화해 보세요.';document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);save();render()}else{wrong++;$('feedback').textContent=wrong<2?'괜찮아요. 다시 생각해 볼까요?':'함께 풀어요. 초록색으로 표시한 답을 골라보세요.';b.style.opacity='.45';if(wrong>=2)document.querySelectorAll('#answers button').forEach(x=>{const right=state.mode==='sound'?BANK[state.index%BANK.length][0]:STORY[state.index%STORY.length].a[STORY[state.index%STORY.length].key];if(x.textContent===right)x.style.background='#b9e6be'})}};$('answers').append(b)}
$('build').onclick=()=>{if(state.gold<40||state.level>=5||paused)return;state.gold-=40;state.level++;save();render();burst('강화! ✨');tone(660);$('feedback').textContent='✨ 타워가 강해졌어요! 강화된 공격을 확인해 보세요.'};

function burst(text){const e=document.createElement('span');e.className='float';e.textContent=text;$('effects').append(e);setTimeout(()=>e.remove(),1000)}
let audioContext;
function tone(freq){if(!$('sfx').checked||paused)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioContext=audioContext||new A();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.04,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.12);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.13)}catch{}}
function drawCombat(events=[]){
 const b=state.combat;if(!b)return;$('enemies').innerHTML='';
 for(const e of b.enemies){if(e.hp<=0||e.escaped||e.x>100)continue;const n=document.createElement('div');n.className='enemy'+(events.some(v=>v.type==='hit'&&v.id===e.id)?' hit':'');n.style.left=e.x+'%';n.textContent='🐺';const bar=document.createElement('progress');bar.max=e.maxHp;bar.value=e.hp;bar.setAttribute('aria-label','늑대 체력 '+e.hp+' / '+e.maxHp);n.append(bar);$('enemies').append(n)}
 $('combatInfo').textContent='막음 '+b.kills+' / '+b.enemies.length+' · 성문 도착 '+b.leaked;
 for(const e of events){if(e.type==='hit'){$('shot').textContent='💧';$('shot').style.left=e.x+'%';tone(360);setTimeout(()=>{$('shot').textContent=''},150)}if(e.type==='leak'){state.hp=Math.max(0,state.hp-e.damage);burst('성문 −'+e.damage)}}
}
$('battle').onclick=()=>{if(!answered||phase!=='question'||paused)return;phase='battle';state.combat=Combat.create(state.index);ticks=0;save();drawCombat();render()};
setInterval(()=>{if(phase!=='battle'||paused)return;ticks++;const events=Combat.step(state.combat,state.level,.1);drawCombat(events);
 if(state.combat.done){const won=state.combat.leaked===0;if(won){state.wins++;burst('마을을 지켰어요!');tone(1046);$('feedback').textContent='🎉 모두 막았어요! 마을이 조금 더 자랐어요.'}else{$('feedback').textContent='늑대 '+state.combat.leaked+'마리가 성문에 도착했어요. 다음에는 타워를 강화해 보세요.'}state.completed=token();phase='result';$('next').classList.remove('hidden');save();render()}
 else {if(ticks%10===0)save();render()}
},100);
$('next').onclick=()=>{if(phase!=='result'||paused)return;state.index++;state.combat=null;state.hp=Math.max(state.hp,60);save();question()};$('pause').onclick=()=>{paused=!paused;save();if(paused&&window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('#answers button').forEach(x=>x.disabled=paused||answered);$('next').disabled=paused;render()};
$('mode').onclick=()=>{if(phase==='battle'||paused)return;if(answered){$('feedback').textContent='이번 방어를 마친 뒤 다음 문제에서 바꿀 수 있어요.';return}state.mode=state.mode==='sound'?'story':'sound';save();question()};$('age').value=state.age;$('age').onchange=()=>{state.age=Number($('age').value);save()};
$('speak').onclick=()=>{if(paused||phase==='battle')return;const text=state.mode==='sound'?BANK[state.index%BANK.length][0]:STORY[state.index%STORY.length].text;if(!window.speechSynthesis){$('feedback').textContent='소리 도움말: '+text;return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=Number($('rate').value)||.85;const voices=speechSynthesis.getVoices();const ko=voices.find(v=>/^ko([-_]|$)/i.test(v.lang));if(ko)u.voice=ko;$('voiceStatus').textContent=ko?'한국어 음성: '+ko.name:'기본 한국어 음성을 요청했어요. 들리지 않으면 도움말을 이용하세요.';u.onstart=()=>{$('voiceStatus').textContent='읽어 주는 중이에요'};u.onend=()=>{$('voiceStatus').textContent='다시 듣거나 직접 읽어 보세요.'};u.onerror=()=>{$('voiceStatus').textContent='이 기기에서 음성을 재생하지 못했어요.';$('feedback').textContent='음성을 사용할 수 없어요. 소리 도움말: '+text};speechSynthesis.speak(u)};
$('reset').onclick=()=>{if(confirm('저장된 골드와 마을을 초기화할까요?')){state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:8};paused=false;$('age').value=8;if(window.speechSynthesis)speechSynthesis.cancel();save();question()}};$('motion').onchange=()=>document.body.classList.toggle('reduced',$('motion').checked);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)$('pause').click()});question();
</script></html>
