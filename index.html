.choice.recommended .rec{display:block}.choice.maxed .price{background:#d9efd0;border-color:#a8cf98}

/* 카드 자체는 가만히 두고 그림만 까딱인다. 누르는 자리가 움직이면 아이가 누르기 어렵다. */
.choices.ready .choice:not(:disabled) img{animation:choiceBob 1.3s ease-in-out infinite}.choices.ready .choice:nth-child(2):not(:disabled) img{animation-delay:.15s}.choices.ready .choice:nth-child(3):not(:disabled) img{animation-delay:.3s}

.growth-panel>small{color:#74836d;line-height:1.7}footer{color:#bdd0ba;font-size:11px;line-height:1.8;margin-top:18px}footer button{font-size:11px;min-height:34px;padding:5px 10px;margin-top:8px}

.coin-spin{display:inline-block;width:30px;height:30px;background:url('art-handoff/coopnight/browser/animation/front.png') center/contain no-repeat;animation:coinFrames .55s steps(1) infinite}

.scene.is3d .impact{display:none}.hidden{display:none!important}
.spawn{animation:spawnPop .55s cubic-bezier(.2,1.5,.4,1) both;transform-origin:50% 100%}

.fx-label{font-size:17px;font-weight:900;white-space:nowrap;padding:6px 12px;border-radius:99px;background:#fffbe9f2;border:2px solid #e9b63c;box-shadow:0 4px 0 #bba76a55;animation:labelUp 1.25s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}
@keyframes impactFade{to{transform:scale(1.4);opacity:0}}

@keyframes coinFrames{0%,100%{background-image:url('art-handoff/coopnight/browser/animation/front.png')}25%{background-image:url('art-handoff/coopnight/browser/animation/quarter.png')}50%{background-image:url('art-handoff/coopnight/browser/animation/edge.png')}75%{background-image:url('art-handoff/coopnight/browser/animation/reverse-quarter.png')}}
@keyframes spawnPop{0%{transform:translateY(-46px) scale(.2,.4);opacity:0}45%{transform:translateY(0) scale(1.22,.82);opacity:1}65%{transform:scale(.92,1.12)}82%{transform:scale(1.05,.97)}100%{transform:scale(1)}}
@keyframes ringOut{0%{scale:.2;opacity:1}60%{opacity:.85}100%{scale:1.35;opacity:0}}
@keyframes dustOut{0%{scale:.35;opacity:.95}100%{scale:1.5;opacity:0;translate:calc(-50% + var(--dx,0px)) calc(-50% - 16px)}}
@keyframes flashOut{0%{scale:.3;opacity:1}100%{scale:1.3;opacity:0}}
@keyframes starOut{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx,0px),var(--dy,-40px)) scale(1.15) rotate(200deg);opacity:0}}
@keyframes labelUp{0%{transform:translateY(10px) scale(.4);opacity:0}18%{transform:translateY(-14px) scale(1.14);opacity:1}30%{transform:translateY(-12px) scale(1)}80%{transform:translateY(-34px) scale(1);opacity:1}100%{transform:translateY(-48px) scale(.96);opacity:0}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes cardPop{0%{transform:scale(1)}25%{transform:scale(.9)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes choiceBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes readyGlow{0%,100%{box-shadow:0 0 0 0 #e9b63c00}50%{box-shadow:0 0 0 6px #e9b63c55}}
@keyframes hintPulse{0%,100%{outline-offset:2px}50%{outline-offset:5px}}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media(max-width:760px){main{padding:10px 10px 20px}.game-layout{grid-template-columns:1fr;gap:12px}header{margin-bottom:10px}h1{font-size:18px}.brand-chicken{width:29px;height:29px}header small{font-size:10px}#pause{font-size:12px;padding:8px 11px;min-height:40px}.stats{display:flex;justify-content:space-between;align-items:center;padding:8px 8px;gap:4px}.pill{font-size:10px;letter-spacing:-.3px}.scene{height:clamp(340px,51svh,480px)}.stage-card{border-width:2px;border-radius:18px;position:static}.stage-caption{padding:7px 10px;font-size:11px}#villageStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel{padding:16px;border-radius:19px}.lesson-kicker{margin-bottom:10px}h2{margin:12px 0 10px;font-size:19px}#answers{margin:12px 0}.choices{padding:10px 8px}.choice{min-height:112px}.choice b{font-size:12px}#feedback{min-height:28px}.growth-panel{margin-top:12px}.growth-title small{display:none}#passage.big{font-size:38px}}
/* 세로로 긴 휴대폰: 카드를 고를 때도 마을이 보이도록 장면을 위에 붙여 둔다. (grid 칸 안에서는 sticky가 움직일 자리가 없어 block으로 바꾼다.) */
@media(max-width:350px){.pill{font-size:9px;letter-spacing:-.5px}}
@media(max-width:760px) and (min-height:620px){.game-layout{display:block}.stage-card{position:sticky;top:4px;margin-bottom:12px}.scene{height:clamp(230px,35svh,330px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
body.reduced *,body.reduced *:before,body.reduced *:after{animation:none!important;transition:none!important}

</style></head><body><main>
<header><div><small>한글 디펜스 · 골라서 짓는 마을 0.5</small><h1><img class="brand-chicken" src="art-handoff/coopnight/browser/characters/chicken.png" alt="">꼬꼬마을: 읽어서 지켜요</h1></div><button id="pause">잠깐 쉬기</button></header>
<div class="game-layout"><section class="stage-card" aria-label="우리 마을">
<div class="stats"><span class="pill" id="gold"></span><span class="pill" id="hp"></span><span class="pill" id="stage"></span><span class="pill" id="level"></span></div>
<div class="scene" id="scene"><div class="road"></div><div class="house"><img id="houseArt" src="art-handoff/coopnight/browser/buildings/home-01.png" alt="우리 마을 집"></div><div class="village-extra" id="villageExtra" aria-hidden="true"></div><div class="fence-row" id="fenceRow" aria-hidden="true"></div><div id="tower" data-level="0"><img id="towerArt" src="art-handoff/coopnight/browser/buildings/tower-01.png" alt="방어 타워"><span class="empty-plot">타워를 세워요</span></div><div class="flock" id="flock" aria-hidden="true"></div><img class="resident" src="art-handoff/coopnight/browser/characters/chicken.png" alt=""><div id="wolf"></div><span id="shot" aria-hidden="true"></span><div id="enemies" aria-label="다가오는 늑대"></div><div id="effects" aria-hidden="true"></div><div id="combatInfo" role="status"></div><div id="shield">읽는 동안 마을은 안전해요</div></div>
<div class="stage-caption"><span class="live-dot" aria-hidden="true"></span><span id="villageStatus">마을을 준비하고 있어요…</span></div></section>
<section class="panel lesson"><p class="lesson-kicker"><span>읽고 · 고르고 · 지켜요</span><span id="levelChip" title="지금 문제의 나이와 단계"></span></p><div class="toolbar"><label>나이 <select id="age" aria-label="나이에 맞는 문제 고르기"><option>7</option><option selected>8</option><option>9</option><option>10</option></select>세</label><button id="mode">📖 짧은 글 읽기</button><button id="speak">🔊 소리 듣기</button></div><div class="settings"><label><input id="sfx" type="checkbox" checked> 효과음</label><label><input id="motion" type="checkbox"> 움직임 줄이기</label><label>읽기 속도 <select id="rate"><option value=".7">천천히</option><option value=".85" selected>보통</option><option value="1">자연스럽게</option></select></label></div><p id="voiceStatus">🔊 소리 듣기를 누르면 읽어 줘요.</p><h2 id="prompt"></h2><div id="passage"></div><div id="answers"></div><div id="feedback" role="status" aria-live="polite"></div>
<div class="lesson-actions" id="actions"><div class="choices" id="choices"><p id="buildPrompt"></p><div class="choice-row">
<button class="choice" id="build" data-kind="tower"><i class="rec">추천</i><span class="count" id="buildCount"></span><img id="buildIcon" src="art-handoff/coopnight/browser/buildings/tower-01.png" alt=""><b id="buildName">타워 세우기</b><small id="buildNote">늑대를 물리쳐요</small><span class="price" id="buildPrice">🪙 40</span></button>
<button class="choice" id="buyChicken" data-kind="chicken"><i class="rec">추천</i><span class="count" id="buyChickenCount"></span><img src="art-handoff/coopnight/browser/characters/chicken.png" alt=""><b>닭 데려오기</b><small>정답마다 +5골드</small><span class="price" id="buyChickenPrice">🪙 20</span></button>
<button class="choice" id="buyFence" data-kind="fence"><i class="rec">추천</i><span class="count" id="buyFenceCount"></span><img src="art-handoff/coopnight/browser/buildings/fence.png" alt=""><b>울타리 치기</b><small>늑대가 느려져요</small><span class="price" id="buyFencePrice">🪙 20</span></button>
</div><p id="outlook"></p></div><div class="go-row"><button id="battle">늑대 막으러 가기 →</button><button id="next" class="hidden">다음 문제 →</button></div></div></section></div>
<section class="panel growth-panel"><div class="growth-title"><b>조금씩 자라는 우리 마을</b><small>한 글자씩 읽을 때마다 더 튼튼하게</small></div><div id="garden"></div><small>문제를 맞히면 골드를 받아요. 타워·닭·울타리 가운데 하나를 골라 지으면 마을에 바로 나타나요. 방어에 성공하면 마을도 자라나요.</small></section>
<footer>진행 상황은 이 브라우저에 저장됩니다. 나이를 바꾸면 그 나이에 맞는 문제가 바로 나와요.<br><button id="reset">처음부터 시작</button></footer>
</main><script src="combat.js"></script><script src="questions.js"></script><script>const KEY='hangul-defense-v1',AGES=Questions.AGES,EGG=5,ART='art-handoff/coopnight/browser/';
/* 상점 규칙: 타워 40골드(최대 5단계) · 닭 20골드(최대 6마리, 정답마다 +5골드) · 울타리 20골드(최대 6칸, 칸마다 늑대 6% 감속) */
const SHOP={tower:{cost:40,max:Combat.MAX_LEVEL,key:'level',id:'build'},chicken:{cost:20,max:6,key:'chickens',id:'buyChicken'},fence:{cost:20,max:Combat.MAX_FENCE,key:'fence',id:'buyFence'}};
let state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:8,chickens:0,fence:0};
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1){for(const k of ['gold','hp','level','wins','index','age','chickens','fence'])if(Number.isSafeInteger(saved[k])&&saved[k]>=0)state[k]=saved[k];state.mode=saved.mode==='story'?'story':'sound';state.claimed=typeof saved.claimed==='string'?saved.claimed:null;state.completed=typeof saved.completed==='string'?saved.completed:null;state.level=Math.min(state.level,SHOP.tower.max);state.chickens=Math.min(state.chickens,SHOP.chicken.max);state.fence=Math.min(state.fence,SHOP.fence.max);state.hp=Math.min(state.hp,100);state.age=AGES.includes(state.age)?state.age:8;state.qage=AGES.includes(saved.qage)?saved.qage:null;state.combat=Combat.valid(saved.combat)?saved.combat:null}}catch{}
let phase='question',answered=false,paused=false,wrong=0,ticks=0,current=null,offered=false,heard=false;
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:1}))}catch{$('feedback').textContent='저장 공간을 사용할 수 없어요. 이번 판은 계속할 수 있어요.'}}
const calm=()=>document.body.classList.contains('reduced')||!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const answerButtons=()=>[...$('answers').children];

let artStamp='';
const TOWER_ART=['01','01','03','05','08','10'];
function artImage(file,alt=''){const img=document.createElement('img');img.src=ART+file;img.alt=alt;img.draggable=false;return img}
function updateVillageArt(){
 const stamp=[state.level,state.wins,state.chickens,state.fence].join(':');if(stamp===artStamp)return;artStamp=stamp;
 $('towerArt').src=ART+'buildings/tower-'+TOWER_ART[state.level]+'.png';$('buildIcon').src=ART+'buildings/tower-'+TOWER_ART[Math.min(5,state.level+1)]+'.png';
 const home=String(Math.min(5,1+Math.floor(state.wins/3))).padStart(2,'0');$('houseArt').src=ART+'buildings/home-'+home+'.png';
 $('villageExtra').innerHTML='';if(state.wins>=3)$('villageExtra').append(artImage('buildings/coop.png'));if(state.wins>=6)$('villageExtra').append(artImage('buildings/store.png'));
 $('flock').innerHTML='';for(let i=0;i<state.chickens;i++){const hen=artImage('characters/chicken.png');hen.style.left=(55+i*6)+'%';hen.style.bottom=(33+(i%2)*8)+'%';$('flock').append(hen)}
 $('fenceRow').innerHTML='';for(let i=0;i<state.fence;i++){const post=artImage('buildings/fence.png');post.style.left=(47+i*8.5)+'%';post.style.bottom='calc(16% + 24px)';$('fenceRow').append(post)}
 $('garden').innerHTML='';$('garden').append(artImage('buildings/home-'+home+'.png','성장한 집'));$('garden').append(artImage('characters/chicken.png','꼬꼬'));if(state.wins>=3)$('garden').append(artImage('buildings/coop.png','닭장'));if(state.wins>=6)$('garden').append(artImage('buildings/store.png','가게'));
 const label=document.createElement('span');label.textContent='마을 성장 '+Math.min(5,1+Math.floor(state.wins/3))+'단계 · 타워 '+state.level+'단계 · 닭 '+state.chickens+'마리 · 울타리 '+state.fence+'칸';$('garden').append(label);
}

/* 다음 방어 예측: 실제 전투 규칙(Combat)을 그대로 돌려 본다. */
let outlookKey='',outlookValue=null;
function leaks(level,fence){const b=Combat.create(state.index);for(let i=0;i<4000&&!b.done;i++)Combat.step(b,level,.1,fence);return b.leaked}
function outlook(){const key=state.index+':'+state.level+':'+state.fence;if(key!==outlookKey){outlookKey=key;outlookValue={now:leaks(state.level,state.fence),tower:state.level<SHOP.tower.max?leaks(state.level+1,state.fence):null,fence:state.fence<SHOP.fence.max?leaks(state.level,state.fence+1):null}}return outlookValue}
function recommend(){const o=outlook();if(o.now===0)return state.chickens<SHOP.chicken.max?'chicken':null;if(state.level===0)return 'tower';if(o.fence===0&&(o.tower!==0||state.gold<SHOP.tower.cost))return 'fence';return state.level<SHOP.tower.max?'tower':state.fence<SHOP.fence.max?'fence':null}
function canBuy(kind){const s=SHOP[kind];return !!s&&!paused&&state.gold>=s.cost&&state[s.key]<s.max}
function affordable(){return Object.keys(SHOP).some(canBuy)}

function render(){ document.body.classList.toggle('paused',paused); $('gold').textContent='🪙 '+state.gold+'골드';$('hp').textContent='💚 성문 '+state.hp;$('level').textContent='🗼'+state.level+' 🐔'+state.chickens+' 🪵'+state.fence;$('level').setAttribute('aria-label','타워 '+state.level+'단계, 닭 '+state.chickens+'마리, 울타리 '+state.fence+'칸');$('stage').textContent='🏅 방어 성공 '+state.wins+'회';$('tower').dataset.level=state.level;updateVillageArt();
 const rec=phase==='question'?recommend():null,can=affordable();
 for(const kind in SHOP){const s=SHOP[kind],n=state[s.key],b=$(s.id),full=n>=s.max;b.disabled=!canBuy(kind);b.classList.toggle('recommended',rec===kind&&!b.disabled);b.classList.toggle('maxed',full);$(s.id+'Count').textContent=n+'/'+s.max;$(s.id+'Price').textContent=full?'완성!':'🪙 '+s.cost}
 $('buildName').textContent=state.level>=SHOP.tower.max?'최고 타워':state.level?'타워 강화':'타워 세우기';$('buildNote').textContent=state.level>=SHOP.tower.max?'가장 튼튼해요':state.level?'공격이 더 세져요':'늑대를 물리쳐요';
 $('choices').classList.toggle('ready',offered&&can);
 $('buildPrompt').textContent=offered&&can?'🎁 맞았어요! 하나 골라 마을에 지어 보세요':can?'🪙 골드가 있어요. 하나 골라 지어 보세요':answered&&phase==='question'?'👍 준비 끝! 이제 늑대를 막으러 가요':'문제를 맞히면 골드로 마을을 키울 수 있어요';
 const o=phase==='question'?outlook():null;$('outlook').className=o&&o.now?'warn':'';$('outlook').textContent=!o?'':o.now===0?'🛡️ 지금 마을이면 늑대를 모두 막을 수 있어요.':state.level===0?'⚠️ 타워가 없으면 늑대를 막을 수 없어요.':'⚠️ 늑대 '+o.now+'마리가 성문까지 올 것 같아요. 타워나 울타리로 대비해요.';
 $('battle').disabled=!answered||phase!=='question'||paused;$('shield').textContent=paused?'⏸️ 쉬는 중이에요':phase==='battle'?'⚔️ 타워가 늑대를 막고 있어요':'🛡️ 읽는 동안 마을은 안전해요';$('pause').textContent=paused?'계속하기':'잠깐 쉬기';$('mode').disabled=phase==='battle'||paused;$('speak').disabled=phase==='battle'||paused;$('age').disabled=phase==='battle'||paused;$('speak').classList.toggle('nudge',phase==='question'&&!answered&&!heard&&state.mode==='sound');}

/* 문제: 나이·모드·순번으로 문제은행에서 꺼낸다. 이미 정답 처리된 문제는 맞힌 때의 나이(qage)로 다시 보여 준다. */
function token(){return state.mode+':'+state.index}
function questionAge(){return (state.claimed===token()||state.completed===token())&&AGES.includes(state.qage)?state.qage:state.age}
function layout(choices){const len=Math.max(...choices.map(c=>[...c].length)),n=choices.length;if(len>6)return ['long','1'];if(len>1)return ['word',n===3&&len<=3?'3':'2'];return ['',n===3?'3':'2']}
function question(){phase='question';answered=state.claimed===token();wrong=0;offered=false;heard=false;$('next').classList.add('hidden');
 current=Questions.get(questionAge(),state.mode,state.index);
 const list=$('answers'),[kind,cols]=layout(current.choices);list.innerHTML='';list.className=kind;list.dataset.cols=cols;list.dataset.qid=current.id;list.dataset.age=String(current.age);list.dataset.mode=current.mode;
 $('feedback').textContent='';$('prompt').textContent=current.prompt;$('passage').textContent=current.passage||'';$('passage').className=current.passage&&[...current.passage].length<=6?'big':'';
 $('levelChip').textContent=current.age+'세 · '+Questions.LEVELS[current.age][current.mode];
 current.choices.forEach((v,i)=>add(v,i));
 $('mode').textContent=state.mode==='sound'?'📖 짧은 글 읽기':'🔤 소리와 글자';
 if(answered){answerButtons().forEach((x,i)=>{x.disabled=true;if(i===current.answer)x.classList.add('correct')});$('feedback').textContent='이 문제의 골드는 이미 받았어요. 방어를 이어가세요.'}
 if(state.completed===token()){phase='result';$('next').classList.remove('hidden');$('feedback').textContent='방어 결과가 저장되어 있어요. 다음 문제로 가세요.'}
 if(answered&&state.completed!==token()&&Combat.valid(state.combat)&&state.combat.stage===state.index&&!state.combat.done){phase='battle';paused=true;drawCombat();$('feedback').textContent='전투를 저장한 지점부터 이어갈 수 있어요. 계속하기를 눌러 주세요.'}
 render();}
function add(label,i){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(paused||answered||phase!=='question')return;
 if(i===current.answer){answered=true;offered=true;state.claimed=token();state.qage=current.age;const bonus=state.chickens*EGG,gain=(state.mode==='story'?40:20)+bonus;state.gold+=gain;
  burst('+'+gain+' 🪙');pop($('gold'),'bump');jingle('correct');window.VillageView?.reward();
  $('feedback').textContent='맞았어요! 🪙 +'+gain+'골드'+(bonus?' (닭 '+state.chickens+'마리 보너스 +'+bonus+')':'');
  answerButtons().forEach(x=>x.disabled=true);b.classList.add('correct');save();render();
  if(affordable())try{$('actions').scrollIntoView({block:'nearest',behavior:calm()?'auto':'smooth'})}catch{}}
 else{wrong++;$('feedback').textContent=wrong<2?'괜찮아요. 다시 생각해 볼까요?':'함께 풀어요. 초록색 테두리로 표시한 답을 골라 보세요.';b.style.opacity='.45';pop(b,'nope');tone(220);
  if(wrong>=2)answerButtons().forEach((x,n)=>{if(n===current.answer){x.style.background='#b9e6be';x.classList.add('hint')}})}};
 $('answers').append(b)}

/* 골라서 짓기: 상태를 바꾼 직후 마을(3D 또는 그림)에 실제로 생성하고 연출한다. */
function buy(kind){const s=SHOP[kind];if(!canBuy(kind))return false;state.gold-=s.cost;state[s.key]++;save();render();
 let at=null;try{const view=window.VillageView;if(view&&view.build)at=view.build(kind)||null;else if(view&&kind==='tower')view.upgrade()}catch{}
 celebrate(kind,at);return true}
$('build').onclick=()=>buy('tower');$('buyChicken').onclick=()=>buy('chicken');$('buyFence').onclick=()=>buy('fence');
const FX_HOME={tower:{x:.5,y:.6},chicken:{x:.62,y:.58},fence:{x:.6,y:.72}};
function pop(el,name){if(!el)return;el.classList.remove(name);void el.offsetWidth;el.classList.add(name)}
function spot(el){try{const s=$('scene').getBoundingClientRect(),r=el.getBoundingClientRect();if(!s.width||!r.width)return null;return {x:(r.left+r.width/2-s.left)/s.width,y:(r.top+r.height/2-s.top)/s.height}}catch{return null}}
function fx(name,at,ms,vars){const e=document.createElement('span');e.className='fx '+name;e.style.left=(at.x*100)+'%';e.style.top=(at.y*100)+'%';if(vars)for(const k in vars)e.style.setProperty(k,vars[k]);$('effects').append(e);setTimeout(()=>e.remove(),ms);return e}
function celebrate(kind,at){const n=state[SHOP[kind].key],three=$('scene').dataset.renderer==='three';
 const made=kind==='tower'?$('tower'):kind==='chicken'?$('flock').children[n-1]:$('fenceRow').children[n-1];
 if(!three&&made){pop(made,'spawn');at=at||spot(made)}
 at=at&&Number.isFinite(at.x)&&Number.isFinite(at.y)?{x:Math.min(.92,Math.max(.08,at.x)),y:Math.min(.9,Math.max(.16,at.y))}:FX_HOME[kind];
 pop($(SHOP[kind].id),'bought');pop($('gold'),'bump');
 if(!calm()){fx('fx-flash',at,340);fx('fx-ring',at,580);if(kind!=='chicken'){fx('fx-dust',at,680,{'--dx':'-34px'});fx('fx-dust',at,680,{'--dx':'34px'})}
  const stars=kind==='tower'?10:7;for(let i=0;i<stars;i++){const a=Math.PI*2*i/stars-Math.PI/2,r=58+(i%3)*18;fx('fx-star',at,720,{'--dx':Math.round(Math.cos(a)*r)+'px','--dy':Math.round(Math.sin(a)*r-12)+'px'}).textContent=kind==='chicken'&&i%2?'♥':'✦'}
  try{window.navigator&&navigator.vibrate&&navigator.vibrate(kind==='tower'?[16,30,26]:14)}catch{}}
 const tag=fx('fx-label',{x:at.x,y:Math.max(.2,at.y-.12)},1300);tag.textContent=kind==='tower'?(n===1?'🗼 타워 완성!':'🗼 타워 '+n+'단계!'):kind==='chicken'?'🐔 꼬꼬 '+n+'마리!':'🪵 울타리 '+n+'칸!';
 /* 이름표는 떠오르는 동안에도 장면 밖으로 잘리지 않게 한다. */
 try{const sw=$('scene').clientWidth,sh=$('scene').clientHeight,half=tag.offsetWidth/2+8;if(sw>0&&sh>0){tag.style.left=Math.min(sw-half,Math.max(half,at.x*sw))+'px';tag.style.top=Math.max(84,(at.y-.12)*sh)+'px'}}catch{}
 jingle(kind);
 $('feedback').textContent=kind==='tower'?(n===1?'🗼 타워를 세웠어요! 이제 늑대를 물리칠 수 있어요.':'🗼 타워가 '+n+'단계가 됐어요! 공격이 더 세졌어요.'):kind==='chicken'?'🐔 꼬꼬가 마을에 왔어요! 이제 정답마다 '+(n*EGG)+'골드를 더 받아요.':'🪵 울타리 '+n+'칸! 늑대가 더 느리게 걸어와요.'}

function burst(text){const e=document.createElement('span');e.className='float';if(text.includes('🪙')){const coin=document.createElement('span');coin.className='coin-spin';e.append(coin);const label=document.createElement('span');label.textContent=text.replace('🪙','').trim();e.append(label)}else e.textContent=text;$('effects').append(e);setTimeout(()=>e.remove(),1000)}
let audioContext;
function note(freq,at=0,dur=.12,type='sine',gain=.04,to=0){if(!$('sfx').checked||paused)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioContext=audioContext||new A();if(audioContext.state==='suspended')audioContext.resume();const t=audioContext.currentTime+at,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+dur+.02)}catch{}}
function tone(freq){note(freq)}
/* 짧은 징글: [주파수, 시작(초), 길이, 파형, 음량, 끝 주파수] */
const JINGLE={correct:[[784,0,.1],[1175,.09,.18]],tower:[[98,0,.22,'triangle',.12,52],[523,.07,.1],[659,.15,.1],[784,.23,.1],[1046,.31,.24]],chicken:[[820,0,.07,'square',.022,1320],[820,.11,.07,'square',.022,1320],[1568,.24,.16]],fence:[[196,0,.07,'triangle',.11,140],[175,.11,.07,'triangle',.11,125],[660,.24,.16]],win:[[523,0,.12],[659,.1,.12],[784,.2,.12],[1046,.3,.3]]};
function jingle(name){for(const n of JINGLE[name])note(...n)}
function drawCombat(events=[]){
 window.VillageView?.events(events);
 const b=state.combat;if(!b)return;$('enemies').innerHTML='';
 for(const e of b.enemies){if(e.hp<=0||e.escaped||e.x>100)continue;const n=document.createElement('div');n.className='enemy'+(events.some(v=>v.type==='hit'&&v.id===e.id)?' hit':'');n.style.left=e.x+'%';n.append(artImage('wolves/wolf.png','늑대'));const bar=document.createElement('progress');bar.max=e.maxHp;bar.value=e.hp;bar.setAttribute('aria-label','늑대 체력 '+e.hp+' / '+e.maxHp);n.append(bar);$('enemies').append(n)}
 $('combatInfo').textContent='막음 '+b.kills+' / '+b.enemies.length+' · 성문 도착 '+b.leaked;
 for(const e of events){if(e.type==='hit'){const hit=document.createElement('span');hit.className='impact';hit.style.left=e.x+'%';$('effects').append(hit);setTimeout(()=>hit.remove(),280);$('shot').textContent='💧';$('shot').style.left=e.x+'%';tone(360);setTimeout(()=>{$('shot').textContent=''},150)}if(e.type==='leak'){state.hp=Math.max(0,state.hp-e.damage);burst('성문 −'+e.damage)}}
}
$('battle').onclick=()=>{if(!answered||phase!=='question'||paused)return;phase='battle';offered=false;state.combat=Combat.create(state.index);ticks=0;save();drawCombat();render()};
setInterval(()=>{if(phase!=='battle'||paused)return;ticks++;const events=Combat.step(state.combat,state.level,.1,state.fence);drawCombat(events);
 if(state.combat.done){const won=state.combat.leaked===0;if(won){state.wins++;burst('마을을 지켰어요!');jingle('win');$('feedback').textContent='🎉 모두 막았어요! 마을이 조금 더 자랐어요.'}else{$('feedback').textContent='늑대 '+state.combat.leaked+'마리가 성문에 도착했어요. 다음에는 타워나 울타리를 더 지어 보세요.'}state.completed=token();phase='result';$('next').classList.remove('hidden');save();render()}
 else {if(ticks%10===0)save();render()}
},100);
$('next').onclick=()=>{if(phase!=='result'||paused)return;state.index++;state.combat=null;state.hp=Math.max(state.hp,60);save();question()};$('pause').onclick=()=>{paused=!paused;save();if(paused&&window.speechSynthesis)speechSynthesis.cancel();answerButtons().forEach(x=>x.disabled=paused||answered);$('next').disabled=paused;render()};
$('mode').onclick=()=>{if(phase==='battle'||paused)return;if(answered){$('feedback').textContent='이번 방어를 마친 뒤 다음 문제에서 바꿀 수 있어요.';return}state.mode=state.mode==='sound'?'story':'sound';save();question()};
/* 나이 전환: 아직 풀지 않은 문제면 그 자리에서 해당 나이 문제로 바꾸고, 이미 푼 문제면 다음 문제부터 적용한다. */
$('age').value=state.age;$('age').onchange=()=>{const age=Number($('age').value);if(!AGES.includes(age)){$('age').value=state.age;return}state.age=age;save();if(phase==='question'&&!answered){question();$('feedback').textContent=age+'세 문제로 바꿨어요.'}else $('feedback').textContent='다음 문제부터 '+age+'세 문제가 나와요.'};
$('speak').onclick=()=>{if(paused||phase==='battle')return;heard=true;$('speak').classList.remove('nudge');const text=current.speak;if(!window.speechSynthesis){$('feedback').textContent='소리 도움말: '+text;return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=Number($('rate').value)||.85;const voices=speechSynthesis.getVoices();const ko=voices.find(v=>/^ko([-_]|$)/i.test(v.lang));if(ko)u.voice=ko;$('voiceStatus').textContent=ko?'한국어 음성: '+ko.name:'기본 한국어 음성을 요청했어요. 들리지 않으면 도움말을 이용하세요.';u.onstart=()=>{$('voiceStatus').textContent='읽어 주는 중이에요'};u.onend=()=>{$('voiceStatus').textContent='다시 듣거나 직접 읽어 보세요.'};u.onerror=()=>{$('voiceStatus').textContent='이 기기에서 음성을 재생하지 못했어요.';$('feedback').textContent='음성을 사용할 수 없어요. 소리 도움말: '+text};speechSynthesis.speak(u)};
$('reset').onclick=()=>{if(confirm('저장된 골드와 마을을 초기화할까요?')){state={gold:20,hp:100,level:0,wins:0,index:0,mode:'sound',age:state.age,chickens:0,fence:0};paused=false;if(window.speechSynthesis)speechSynthesis.cancel();save();question()}};$('motion').onchange=()=>document.body.classList.toggle('reduced',$('motion').checked);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)$('pause').click()});question();

window.getVillageState=()=>({level:state.level,wins:state.wins,chickens:state.chickens,fence:state.fence,phase,paused,combat:state.combat});
</script><script src="village.js" defer></script></body></html>
