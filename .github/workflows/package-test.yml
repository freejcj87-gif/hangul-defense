name: Package playable test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - combat.js
      - questions.js
      - src/village.js
      - art-handoff/coopnight/browser/**
      - art-handoff/coopnight/source-3d/models/environment-pack.glb
      - scripts/build-pages.cjs
      - .github/workflows/package-test.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-questions.cjs
      - run: node test-dom.cjs
      - run: npm install --no-save --package-lock=false three@0.180.0 esbuild@0.25.10
      - run: node scripts/build-pages.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hangul-defense-playable
          path: .pages-build/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
