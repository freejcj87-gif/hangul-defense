name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - combat.js
      - art-handoff/coopnight/browser/**
      - scripts/build-pages.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game rules
        run: node test-dom.cjs
      - name: Package game and used artwork
        run: node scripts/build-pages.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read enabled Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
