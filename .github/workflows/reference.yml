name: Inspect original village reference
on:
  push:
    branches: [improve/living-village-v04]
    paths:
      - scripts/inspect-coopnight.cjs
      - .github/workflows/reference.yml
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/inspect-coopnight.cjs
