name: Validate prototype
on:
  push:
    branches: [improve/village-combat-v02, improve/living-village-v04, claude/village-polish]
  pull_request:
    branches: [main]
concurrency:
  group: prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-questions.cjs
      - run: node test-dom.cjs
      - run: node test-book.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 three@0.180.0 esbuild@0.25.10
      - name: Install browsers (kill a stalled download and retry, up to 3 times)
        run: |
          for attempt in 1 2 3; do
            if timeout -k 10 300 npx playwright install --with-deps chromium webkit; then exit 0; fi
            echo "install attempt $attempt failed or stalled; cleaning up apt and retrying"
            sudo pkill -9 -f apt-get || true
            sudo pkill -9 dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
            sleep 5
          done
          exit 1
      - run: node scripts/build-pages.cjs
      - run: node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          retention-days: 7
      # 수첩 MVP 화면 캡처(눈으로 보는 용도): 실패해도 위 검사 결과를 가리지 않는다
      - name: Notebook screenshots
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/book-shots.cjs book-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-shots
          path: book-shots/
          if-no-files-found: warn
          retention-days: 7
