name: Validate prototype
on:
  push:
    branches: [improve/village-combat-v02, improve/living-village-v04, claude/village-polish]
  pull_request:
    branches: [main]
concurrency:
  group: prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 60   # 0.16: 0.15.2 대형 검사 + 수첩 검사·캡처가 더해져 느린 러너에서 39분(2026-11-19 실행 44480823614)까지 걸려 여유를 둠
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-questions.cjs
      - run: node test-dom.cjs
      - run: node test-book.cjs
      # 출시 자리표시(개발자 이름·문의 이메일·시행일 등)는 경고 주석으로만 보인다(실패 아님). 제출 직전 관문은 --strict
      - name: Release placeholders (warning only)
        run: node scripts/check-release.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 three@0.180.0 esbuild@0.25.10
      - run: node scripts/build-pages.cjs
      - run: node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          retention-days: 7
      # 수첩 MVP 화면 캡처(눈으로 보는 용도): 실패해도 위 검사 결과를 가리지 않는다
      - name: Notebook screenshots
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/book-shots.cjs book-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-shots
          path: book-shots/
          if-no-files-found: warn
          retention-days: 7
