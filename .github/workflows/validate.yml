name: Validate prototype
on:
  push:
    branches: [improve/village-combat-v02, improve/living-village-v04]
  pull_request:
    branches: [main]
concurrency:
  group: prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-dom.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 three@0.180.0 esbuild@0.25.10
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/build-pages.cjs
      - run: node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          retention-days: 7
