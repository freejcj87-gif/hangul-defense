name: Build Android app
# 꼬꼬마을 Android 껍데기(Capacitor, android-app/)로 QA용 디버그 APK와 출시용 release AAB를 만든다. 웹 배포(pages.yml)와는 따로 돈다.
# QA APK: 패키지 ...hanguldefense.qa, 이름 '꼬꼬마을 QA', 시작 주소 ?test=1, WebView 원격 디버깅 켜짐(디버그 빌드). 출시 앱과 나란히 설치된다.
# 출시 AAB: 시작 주소 /, 원격 디버깅 꺼짐. 저장소 Secrets 4개(ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD,
#           ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD)가 모두 있을 때만 업로드 키로 서명한다. 없으면 서명 안 된 AAB(Play에는 못 올림).
# 버전: android-app/scripts/version.cjs(게임 버전 index.html ?v= → versionCode·versionName). 같은 게임 버전을 다시 올릴 때만 build_number를 올린다.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '같은 게임 버전을 Play에 다시 올릴 때 0~99 (versionCode 끝 두 자리)'
        required: false
        default: '0'
  push:
    branches: [main, claude/android-shell]
    paths:
      - index.html
      - combat.js
      - world.js
      - questions.js
      - questions-gen.js
      - book.js
      - notes.js
      - bookui.js
      - testmode.js
      - src/**
      - art-handoff/coopnight/source-3d/models/environment-pack.glb
      - art-handoff/coopnight/browser/**
      - art-handoff/v015-v016/**
      - scripts/build-pages.cjs
      - android-app/**
      - .github/workflows/android.yml
  pull_request:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/android.yml
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HD_BUILD_NUMBER: ${{ github.event.inputs.build_number || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - name: Validate question bank
        run: node test-questions.cjs
      - name: Validate game rules
        run: node test-dom.cjs
      - name: Web build tools (same pins as Pages)
        run: npm install --no-save --package-lock=false three@0.180.0 esbuild@0.25.10
      - name: Android shell packages
        working-directory: android-app
        run: npm ci
      - name: Version rule self-test
        working-directory: android-app
        run: npm run check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      - name: QA - package the web game (start ?test=1)
        working-directory: android-app
        run: npm run sync:qa
      - name: QA - app shell behaviour (simulated bridge)
        working-directory: android-app
        run: npm run test:shell
      - name: QA - check start path
        run: |
          grep -q '"appStartPath": "/?test=1"' android-app/android/app/src/main/assets/capacitor.config.json
      - name: QA - build debug APK and no-INTERNET test APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleNonet
          nonet=$(find app/build/intermediates -path '*nonet*' -name AndroidManifest.xml | head -n 1)
          echo "No-INTERNET test build manifest: $nonet"
          if grep -q 'android.permission.INTERNET' "$nonet"; then echo 'INTERNET permission is still in the nonet build'; exit 1; fi

      - name: Release - package the web game
        working-directory: android-app
        run: npm run sync
      - name: Release - check packaged web assets
        run: |
          public=android-app/android/app/src/main/assets/public
          config=android-app/android/app/src/main/assets/capacitor.config.json
          test -f "$public/index.html"
          grep -q 'app-shell.js' "$public/index.html"
          if grep -q 'viewport-fit=cover' "$public/index.html"; then echo 'viewport-fit=cover should be removed in the app copy'; exit 1; fi
          grep -q '게임 기록은 이 기기에 저장되고, 개발자에게 보내지 않아요.' "$public/index.html"
          if grep -q '이 브라우저에 저장' "$public/index.html"; then echo 'app footer must say this device, not this browser (policy 03 section 4)'; exit 1; fi
          if grep -q 'appStartPath' "$config"; then echo 'release config must not have appStartPath'; exit 1; fi
          if grep -q 'webContentsDebuggingEnabled' "$config"; then echo 'leave webContentsDebuggingEnabled unset (debug-only default)'; exit 1; fi
          test -f "$public/village.js"
          test -f "$public/bookui.js"
          test -f "$public/webview-old.html"
          test -f "$public/oss-licenses.html"
          test -f "$public/art-handoff/coopnight/source-3d/models/environment-pack.glb"
          test ! -e "$public/robots.txt"
          cat android-app/android/app/hd-version.properties
          du -sh "$public"
      - name: Release - restore upload key (only when secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "HD_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo 'Signing: release AAB will be signed with the upload key.'
          else
            echo 'Signing: no upload key secret, release AAB stays unsigned (cannot be uploaded to Play).'
          fi
      - name: Release - build AAB
        working-directory: android-app/android
        env:
          HD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          HD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          HD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Remove upload key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Policy report (dependencies, merged permissions, native libraries)
        working-directory: android-app/android
        run: |
          ./gradlew --no-daemon -q app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-dependencies.txt"
          if grep -Ei 'firebase|play-services-ads|play-services-measurement|crashlytics|com\.google\.android\.gms' "$RUNNER_TEMP/release-dependencies.txt"; then echo 'Blocked library found (kids app: no analytics, ads, Firebase)'; exit 1; fi
          merged=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          echo "Merged manifest: $merged"
          grep -o 'uses-permission[^>]*' "$merged" | sort -u | tee "$RUNNER_TEMP/release-permissions.txt"
          if grep -Ei 'AD_ID|LOCATION|READ_PHONE|CONTACTS|CAMERA|RECORD_AUDIO|EXTERNAL_STORAGE|READ_MEDIA' "$RUNNER_TEMP/release-permissions.txt"; then echo 'Blocked permission found'; exit 1; fi
          # Allowlist: anything new must be a deliberate decision (progress-file transfer uses the system document screen and share sheet, no permission).
          unexpected=$(grep -o 'android:name="[^"]*"' "$RUNNER_TEMP/release-permissions.txt" | sed 's/^android:name="//; s/"$//' | grep -Ev '^android\.permission\.(INTERNET|VIBRATE)$|\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$' || true)
          if [ -n "$unexpected" ]; then echo "Permission not on the allowlist: $unexpected"; exit 1; fi
          # Phones and tablets (producer decision 2026-11-20): nothing may filter out phones or lock orientation in the manifest.
          # Phones get portrait at runtime (MainActivity, smallest width < 600dp); large screens stay free.
          grep -o 'uses-feature[^>]*' "$merged" || echo 'uses-feature: none'
          if grep -Eq 'compatible-screens|requiresSmallestWidthDp|smallScreens="false"|normalScreens="false"|android:screenOrientation' "$merged"; then
            grep -En 'compatible-screens|requiresSmallestWidthDp|supports-screens|screenOrientation' "$merged"
            echo 'Merged manifest filters screen sizes or locks orientation (phones and tablets must both be served)'; exit 1
          fi
          echo 'Native libraries in AAB (16KB page size matters only if any are listed):'
          unzip -l app/build/outputs/bundle/release/*.aab | grep '\.so$' || echo 'none'
          cp "$RUNNER_TEMP/release-dependencies.txt" "$RUNNER_TEMP/release-permissions.txt" app/build/outputs/
      - name: List outputs
        run: ls -la android-app/android/app/build/outputs/apk/debug/ android-app/android/app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v7
        with:
          name: hangul-defense-android
          path: |
            android-app/android/app/build/outputs/apk/debug/*.apk
            android-app/android/app/build/outputs/apk/nonet/*.apk
            android-app/android/app/build/outputs/bundle/release/*.aab
            android-app/android/app/hd-version.properties
            android-app/android/app/build/outputs/release-*.txt
          retention-days: 14
          if-no-files-found: error
