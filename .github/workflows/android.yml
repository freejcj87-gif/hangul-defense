name: Build Android app
# 꼬꼬마을 Android 껍데기(Capacitor, android-app/)로 디버그 APK와 release AAB를 만든다. 웹 배포(pages.yml)와는 따로 돈다.
# 서명: 저장소 Secrets 4개(ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD)가
#       모두 있을 때만 AAB를 업로드 키로 서명한다. 없으면 서명 안 된 AAB(Play에는 못 올림)와 디버그 APK만 나온다.
# 버전: android-app/scripts/version.cjs(게임 버전 index.html ?v= → versionCode·versionName). 같은 게임 버전을 다시 올릴 때만 build_number를 올린다.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '같은 게임 버전을 Play에 다시 올릴 때 0~99 (versionCode 끝 두 자리)'
        required: false
        default: '0'
  push:
    branches: [main, claude/android-shell]
    paths:
      - index.html
      - combat.js
      - world.js
      - questions.js
      - questions-gen.js
      - src/**
      - art-handoff/coopnight/source-3d/models/environment-pack.glb
      - art-handoff/coopnight/browser/**
      - scripts/build-pages.cjs
      - android-app/**
      - .github/workflows/android.yml
  pull_request:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/android.yml
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HD_BUILD_NUMBER: ${{ github.event.inputs.build_number || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - name: Validate question bank
        run: node test-questions.cjs
      - name: Validate game rules
        run: node test-dom.cjs
      - name: Web build tools (same pins as Pages)
        run: npm install --no-save --package-lock=false three@0.180.0 esbuild@0.25.10
      - name: Android shell packages
        working-directory: android-app
        run: npm ci
      - name: Version rule self-test
        working-directory: android-app
        run: npm run check
      - name: Package the web game into the app
        working-directory: android-app
        run: npm run sync
      - name: App shell behaviour (simulated bridge)
        working-directory: android-app
        run: node scripts/test-shell.cjs
      - name: Check packaged web assets
        run: |
          public=android-app/android/app/src/main/assets/public
          test -f "$public/index.html"
          grep -q 'app-shell.js' "$public/index.html"
          if grep -q 'viewport-fit=cover' "$public/index.html"; then echo 'viewport-fit=cover should be removed in the app copy'; exit 1; fi
          test -f "$public/village.js"
          test -f "$public/art-handoff/coopnight/source-3d/models/environment-pack.glb"
          test ! -e "$public/robots.txt"
          cat android-app/android/app/hd-version.properties
          du -sh "$public"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
      - name: Restore upload key (only when secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "HD_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo 'Signing: release AAB will be signed with the upload key.'
          else
            echo 'Signing: no upload key secret, release AAB stays unsigned (cannot be uploaded to Play).'
          fi
      - name: Build debug APK and release AAB
        working-directory: android-app/android
        env:
          HD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          HD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          HD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Remove upload key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: List outputs
        run: ls -la android-app/android/app/build/outputs/apk/debug/ android-app/android/app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        with:
          name: hangul-defense-android
          path: |
            android-app/android/app/build/outputs/apk/debug/*.apk
            android-app/android/app/build/outputs/bundle/release/*.aab
            android-app/android/app/hd-version.properties
          retention-days: 14
          if-no-files-found: error
