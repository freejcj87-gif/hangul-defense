<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>친구 카드 렌더(개발용)</title>
<!-- scripts/card-shots.cjs가 이 페이지를 열어 카드 그림 16장을 만든다(배포 묶음에 넣지 않음). 카드 바탕은 index.html의 .card-art와 같은 색 -->
<style>
body{margin:0;background:#fffdf2;font:13px system-ui,sans-serif;color:#3a3326}
#sheet{display:grid;grid-template-columns:repeat(6,150px);gap:14px 12px;padding:14px}
.cell{display:grid;gap:4px;justify-items:center}
.frame{position:relative;width:150px;height:200px;border-radius:12px;overflow:hidden;background:radial-gradient(130% 85% at 50% 32%,#fffaf0 0%,#fde9c4 58%,#f5d29b 100%);box-shadow:inset 0 0 0 2px #ecd09a}
.frame.shiny{background:radial-gradient(130% 85% at 50% 32%,#fffdf4 0%,#fff0bf 45%,#f6c9e0 100%);box-shadow:inset 0 0 0 3px #f2c14e,0 0 8px 2px #ffe27a}
.frame img{display:block;width:100%;height:100%;object-fit:contain}
.frame.sil img{filter:brightness(0) opacity(.35)}
</style></head>
<body><div id="sheet"></div><script src="card-render.js"></script></body></html>
